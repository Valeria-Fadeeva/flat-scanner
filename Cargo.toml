[package]
name = "scan"
version = "0.1.0"
edition = "2024"
authors = ["Valeria Fadeeva <valeria.fadeeva.me@gmail.com>"]

[dependencies]
# CLI-парсер аргументов командной строки
clap = { version = "4.6", features = ["derive"] }

# Асинхронное вычислительное ядро
tokio = { version = "1.53", features = ["full", "macros"] }
axum = { version = "0.8.9", features = ["json"] }
tower-http = { version = "0.7", features = ["cors"] }

# Сериализация данных (Обмен JSON со ScannerBLoC)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Низкоуровневые биндинги компьютерного зрения (OpenCV 4.x)
# Примечание: Требует наличия установленного пакета opencv в Arch Linux
opencv = "0.100"

# TIFF/CCITT Group 4 сжатие для монохромных изображений
tiff = "0.11"

# SQLite для транзакционного хранения сессий сканирования
rusqlite = { version = "0.40", features = ["bundled"] }

# Генерация UUID для сессий и книг
uuid = { version = "1.24", features = ["v4", "serde"] }

[profile.release]
opt-level = 3           # Максимальная оптимизация кода ядра
lto = true              # Сквозная линковка при компиляции для вырезания мертвого кода
codegen-units = 1       # Уменьшает параллельные юниты сборки ради глубокой оптимизации
panic = "abort"         # Отмена раскрутки стека при панике для легковесности бинарника

[build-dependencies]
pkg-config = "0.3.34"
